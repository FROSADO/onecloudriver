name: Release

on:
  push:
    tags:
      - 'v*'

# ──── Build + Dist + Release ────
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # NOTE: FUSE cannot be used inside a container on hosted runners
    # (opening /dev/fuse requires privileges the container lacks), and
    # make test-all runs the FUSE integration tests, so this job runs
    # directly on the runner host.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 dpkg-dev
          sudo modprobe fuse 2>/dev/null || true
          sudo chmod 666 /dev/fuse 2>/dev/null || true
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: Run all tests
        run: make test-all

      - name: Build distribution zip
        run: make dist

      - name: Build .deb package
        run: make deb

      - name: Extract changelog section
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"  # v0.1.0 → 0.1.0
          awk -v ver="$V" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fallback if no section found
          [ -s release-notes.md ] || echo "## ${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            onecloudriver_linux_amd64.zip
            onecloudriver_*.deb
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
