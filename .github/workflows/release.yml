name: Release

on:
  push:
    tags:
      - 'v*'

# ──── Build + Dist + Release ────
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # NOTE: FUSE cannot be used inside a container on hosted runners
    # (opening /dev/fuse requires privileges the container lacks), and
    # make test-all runs the FUSE integration tests, so this job runs
    # directly on the runner host.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 dpkg-dev rpm gnupg
          sudo modprobe fuse 2>/dev/null || true
          sudo chmod 666 /dev/fuse 2>/dev/null || true
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: Run all tests
        run: make test-all

      - name: Build distribution zip
        run: make dist

      - name: Build .deb package
        run: make deb
      - name: Build .rpm package
        run: make rpm

      # ──── Packaged unit sanity check ────
      # Regression guard for issue #44: the systemd user unit shipped inside
      # the .deb/.rpm must contain SINGLE %i/%h specifiers. A leftover '%%i'
      # (printf/Make escaping) means systemd treats it as a literal '%i' and
      # the instance name never expands. The Makefile targets already check the
      # generated file; this step re-checks the ACTUAL file inside the built
      # packages, so a regression in the packaging chain cannot slip through.
      - name: Verify packaged systemd unit (%i specifiers)
        run: |
          set -euo pipefail
          echo "── .deb unit ──"
          dpkg-deb --fsys-tarfile onecloudriver_*.deb \
            | tar -xO ./usr/lib/systemd/user/onecloudriver@.service | tee /tmp/unit.deb
          echo "── .rpm unit ──"
          rpm2cpio onecloudriver-*.rpm \
            | cpio -i --to-stdout './usr/lib/systemd/user/onecloudriver@.service' 2>/dev/null \
            | tee /tmp/unit.rpm
          for u in /tmp/unit.deb /tmp/unit.rpm; do
            grep -q '[^%]%i' "$u" || { echo "FAIL: $u has no single %i specifier"; exit 1; }
            if grep -q '%%i' "$u"; then
              echo "FAIL: $u contains escaped '%%i' (instance specifier broken)"; exit 1
            fi
            echo "OK: $u contains single %i and no '%%i'"
          done
          if command -v systemd-analyze &>/dev/null; then
            systemd-analyze verify /tmp/unit.deb || true
          fi

      # ──── Signing (checksums + GPG) ────
      # Imports the release-signing key from the repository secrets and signs
      # the SHA256SUMS manifest plus every artifact. If GPG_PRIVATE_KEY /
      # GPG_PASSPHRASE are not configured, this step fails loudly so a release
      # can never be published unsigned by accident.
      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - name: Generate SHA256SUMS and GPG signatures
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Feed the passphrase via stdin (--passphrase-fd 0) so it never
          # shows up in the process list.
          sign() {
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --armor \
                --pinentry-mode loopback --passphrase-fd 0 --detach-sign "$@"
          }
          # Checksum manifest covering every artifact
          sha256sum onecloudriver_linux_amd64.zip onecloudriver_*.deb onecloudriver-*.rpm > SHA256SUMS
          # Sign the manifest (SHA256SUMS.asc)
          sign --output SHA256SUMS.asc SHA256SUMS
          # Sign each artifact individually
          for f in onecloudriver_linux_amd64.zip onecloudriver_*.deb onecloudriver-*.rpm; do
            sign --output "${f}.asc" "$f"
          done
          # Publish the public key so users can verify the signatures
          gpg --armor --export "${{ steps.import_gpg.outputs.fingerprint }}" > public.key
          ls -la SHA256SUMS SHA256SUMS.asc *.asc public.key

      - name: Verify signatures before publishing
        run: |
          set -euo pipefail
          # Self-check: never publish a release with broken signatures.
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS
          for f in onecloudriver_linux_amd64.zip onecloudriver_*.deb onecloudriver-*.rpm; do
            gpg --verify "${f}.asc" "$f" >/dev/null 2>&1
          done
          echo "All signatures verified."

      - name: Extract changelog section
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"  # v0.1.0 → 0.1.0
          awk -v ver="$V" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fallback if no section found
          [ -s release-notes.md ] || echo "## ${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            onecloudriver_linux_amd64.zip
            onecloudriver_*.deb
            onecloudriver-*.rpm
            SHA256SUMS
            SHA256SUMS.asc
            onecloudriver_linux_amd64.zip.asc
            onecloudriver_*.deb.asc
            onecloudriver-*.rpm.asc
            public.key
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
