name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──── Build ────
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # ──── Unit Tests + Race ────
  test:
    name: Tests (unit + race)
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with race detector
        run: make test-unit-short
      - name: Test other packages
        run: |
          go test ./internal/auth/... -count=1 -race -short -timeout 60s
          go test ./internal/graph/... -count=1 -race -short -timeout 60s

  # ──── Integration Tests (FUSE) ────
  test-integration:
    name: Tests (integration FUSE)
    runs-on: ubuntu-latest
    needs: build
    # NOTE: FUSE cannot be used inside a container on hosted runners
    # (opening /dev/fuse requires privileges the container lacks), so this
    # job runs directly on the runner host.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          sudo modprobe fuse 2>/dev/null || echo "  (fuse built-in or already loaded)"
          sudo usermod -aG fuse "${USER:-$(id -un)}" 2>/dev/null || true
          if [ ! -e /dev/fuse ]; then
            sudo mknod /dev/fuse c 10 229 2>/dev/null || true
          fi
          sudo chmod 666 /dev/fuse 2>/dev/null || true
          ls -la /dev/fuse
      - name: Integration tests
        run: make test-integration-short

  # ──── Lint (advisory on push, blocking on PR) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    # On push to main: advisory (non-blocking). On PR: blocking.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint is pre-installed in the runner image
      # (ghcr.io/frosado/onecloudriver-ci) — bump it there, not here.
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --new-from-rev=HEAD~1 ./...

  # ──── Security Audit (advisory on push, blocking on PR) ────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: ${{ github.event_name == 'push' }}
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # gosec, govulncheck and golangci-lint are pre-installed in the runner
      # image (ghcr.io/frosado/onecloudriver-ci) — bump them there, not here.
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: gosec (SAST)
        run: gosec -quiet -severity=high ./...
      - name: govulncheck (CVEs)
        run: govulncheck ./...
      - name: Security lint
        run: golangci-lint run --timeout=5m -c .golangci-security.yml --new-from-rev=HEAD~1 ./...

  # ──── Coverage ────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/...,./cmd/... ./internal/... ./cmd/...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: Install goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: Send coverage
        env:
            COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=coverage.out -service=github
