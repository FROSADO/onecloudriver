name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──── Build ────
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure git safe directory
        run: git config --global --add safe.directory '*'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # ──── Unit Tests + Race ────
  test:
    name: Tests (unit + race)
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests with race detector
        run: make test-unit-short
      - name: Test other packages
        run: |
          go test ./internal/auth/... -count=1 -race -timeout 60s
          go test ./internal/graph/... -count=1 -race -timeout 60s

  # ──── Integration Tests (FUSE) ────
  test-integration:
    name: Tests (integration FUSE)
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup FUSE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          sudo modprobe fuse 2>/dev/null || echo "  (fuse built-in o ya cargado)"
          sudo usermod -aG fuse $USER 2>/dev/null || true
          if [ ! -e /dev/fuse ]; then
            sudo mknod /dev/fuse c 10 229 2>/dev/null || true
          fi
          sudo chmod 666 /dev/fuse 2>/dev/null || true
          ls -la /dev/fuse
      - name: Integration tests
        run: make test-integration-short

  # ──── Lint (advisory on push, blocking on PR) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    # En push a main: no bloquea (advisory). En PR: bloquea.
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --new-from-rev=HEAD~1 ./...

  # ──── Security Audit (advisory on push, blocking on PR) ────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: ${{ github.event_name == 'push' }}
    container:
      image: ghcr.io/frosado/onecloudriver-ci:latest-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: gosec (SAST)
        run: gosec -quiet -severity=high ./...
      - name: govulncheck (CVEs)
        run: govulncheck ./...
      - name: Security lint
        run: golangci-lint run --timeout=5m -c .golangci-security.yml --new-from-rev=HEAD~1 ./...

  # ──── Coverage ────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate coverage
        run: |
          go test ./internal/fs/... -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
